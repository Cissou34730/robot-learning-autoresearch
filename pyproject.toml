[project]
name = "robot-learning"
version = "0.1.0"
description = "Local virtual robotics learning playground for reinforcement learning experimentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "mujoco>=3.12.0",
    "numpy>=2.5.2",
    "stable-baselines3>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "tensorboard>=2.21.0",
]
researcher = [
    "github-copilot-sdk>=1.0.11",
    "jello>=1.6.1",
]
